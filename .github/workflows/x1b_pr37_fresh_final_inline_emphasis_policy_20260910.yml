name: X1B-FRAME PR37 fresh final inline-emphasis policy review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact frozen ScriptOps candidate
        uses: actions/checkout@v4
        with:
          repository: FJ899/scriptops
          ref: 7515cbc1f506c7c342dc55abcc97cf884daf0987
          path: target
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review-only CommonMark parser
        run: python -m pip install pyyaml markdown-it-py

      - name: Verify exact frozen binding and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          HEAD=$(git -C target rev-parse HEAD)
          TREE=$(git -C target rev-parse 'HEAD^{tree}')
          VERIFIER=$(git -C target hash-object scripts/verify_repository.py)
          printf 'HEAD=%s\nTREE=%s\nVERIFIER=%s\n' "$HEAD" "$TREE" "$VERIFIER"
          test "$HEAD" = "7515cbc1f506c7c342dc55abcc97cf884daf0987"
          test "$TREE" = "2b9235a9701a625e96e60c254bc1386e17039dd7"
          test "$VERIFIER" = "7947c6889b80cd86ce267be792bd68e449e24235"
          test -z "$(git -C target status --porcelain=v1)"

      - name: Run first fresh-final semantic-equivalence case
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/inline_emphasis_policy_probe.py" <<'PY'
          from __future__ import annotations

          from html.parser import HTMLParser
          from markdown_it import MarkdownIt
          import pathlib
          import sys

          target = pathlib.Path("target").resolve()
          sys.path.insert(0, str(target / "scripts"))
          import verify_repository as current

          parser = current.core._authority_soft_wrapped_units
          claim = current.core.layer_b_self_promotion_claim

          control = "This file grants release authority.\n"
          test = "Th**is** file grants release authority.\n"

          class VisibleText(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.parts: list[str] = []
              def handle_data(self, data: str) -> None:
                  self.parts.append(data)

          md = MarkdownIt("commonmark")

          def visible_markdown(source: str) -> str:
              rendered = md.render(source)
              p = VisibleText()
              p.feed(rendered)
              p.close()
              return "".join(p.parts).strip()

          def rejected(source: str) -> tuple[bool, str]:
              try:
                  current.core.validate_layer_b_non_authority_text(
                      "acceptance/inert.md", source
                  )
              except current.core.VerificationError as exc:
                  return True, str(exc)
              return False, "ACCEPTED"

          control_visible = visible_markdown(control)
          test_visible = visible_markdown(test)
          visible_equivalent = control_visible == test_visible
          control_units = parser(control)
          test_units = parser(test)
          control_claim = claim(control)
          test_claim = claim(test)
          control_rejected, control_reason = rejected(control)
          test_rejected, test_reason = rejected(test)

          print(f"CONTROL_SOURCE={control!r}")
          print(f"TEST_SOURCE={test!r}")
          print(f"VISIBLE_CONTROL={control_visible!r}")
          print(f"VISIBLE_TEST={test_visible!r}")
          print(f"VISIBLE_EQUIVALENT={visible_equivalent}")
          print(f"CONTROL_UNITS={control_units!r}")
          print(f"TEST_UNITS={test_units!r}")
          print(f"CONTROL_CLAIM={control_claim!r}")
          print(f"TEST_CLAIM={test_claim!r}")
          print(f"CONTROL_REJECTED={control_rejected}")
          print(f"CONTROL_REASON={control_reason!r}")
          print(f"TEST_REJECTED={test_rejected}")
          print(f"TEST_REASON={test_reason!r}")

          control_ok = (
              visible_equivalent
              and control_visible == "This file grants release authority."
              and len(control_units) == 1
              and len(test_units) == 1
              and control_claim is not None
              and control_rejected
          )
          print(f"CONTROL_STRUCTURAL_OK={control_ok}")
          if not control_ok:
              print("RESULT=CONTROL_INVALID_FINAL_REVIEW_NOT_ESTABLISHED")
              raise SystemExit(2)

          if test_claim is not None and test_rejected:
              print("RESULT=PASS_FRESH_FINAL_INLINE_EMPHASIS_POLICY_CASE")
              raise SystemExit(0)

          print("RESULT=FAIL_REPRODUCIBLE_FRESH_FINAL_INLINE_EMPHASIS_POLICY_NORMALIZATION")
          raise SystemExit(1)
          PY
          python -B "$RUNNER_TEMP/inline_emphasis_policy_probe.py"

      - name: Confirm frozen target remained unmodified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(git -C target status --porcelain=v1)
          printf 'TARGET_STATUS=%q\n' "$STATUS"
          test -z "$STATUS"
