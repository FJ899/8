name: Post-v0 integration validation

on:
  workflow_dispatch:
  push:
    branches:
      - post-v0-integration

permissions:
  contents: read

concurrency:
  group: post-v0-integration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact integration SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind integration instance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p post-v0-evidence
          {
            printf 'GITHUB_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            printf 'GITHUB_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'GITHUB_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'TREE=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'BASE_ACCEPTED_G4_HEAD=%s\n' '930b8cae575edba1becc47fbebd9d944a5ebd68d'
            printf 'UID=%s\n' "$(id -u)"
            printf 'GID=%s\n' "$(id -g)"
            printf 'UNAME=%s\n' "$(uname -a)"
            printf 'PYTHON=%s\n' "$(python --version 2>&1)"
            printf 'GIT=%s\n' "$(git --version)"
          } | tee post-v0-evidence/execution_instance.txt

      - name: Run full G1 regression set
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_g1
          python -m unittest -v tests.test_g1_f005
          python -m unittest -v tests.test_g1_f006
          python -m unittest -v tests.test_g1_f009
          python -m unittest -v tests.test_g1_f011

      - name: Run full G2 regression set and topology
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_g2
          bash scripts/run_g2_topology.sh post-v0-evidence/g2-topology

      - name: Run full G3 regression set
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_g3

      - name: Run full G4 regression set and topology
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_g4 tests.test_g4_f001_f002 tests.test_g4_f003 tests.test_g4_f005 2>&1 | tee post-v0-evidence/g4-tests.log
          bash scripts/run_g4_topology.sh post-v0-evidence/g4-topology

      - name: Capture integration evidence
        shell: bash
        run: |
          set -euo pipefail
          python -I -c 'import runpy,sys; sys.path.insert(0,"."); sys.argv=["scripts/capture_g4_evidence.py","--output-dir","post-v0-evidence/g4-state"]; runpy.run_path("scripts/capture_g4_evidence.py",run_name="__main__")' 2>&1 | tee post-v0-evidence/capture-g4.log
          python -I -c 'import runpy,sys; sys.path.insert(0,"."); sys.argv=["scripts/capture_g4_f001_f002.py","--output","post-v0-evidence/g4-state/g4_f001_f002.json"]; runpy.run_path("scripts/capture_g4_f001_f002.py",run_name="__main__")' 2>&1 | tee post-v0-evidence/capture-g4-f001-f002.log

      - name: Hash integration evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find post-v0-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > post-v0-evidence/SHA256SUMS

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-v0-integration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-v0-evidence/
          if-no-files-found: error
          retention-days: 14
