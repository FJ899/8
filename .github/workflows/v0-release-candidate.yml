name: v0 release candidate validation

on:
  workflow_dispatch:
  push:
    branches:
      - v0-release-prep

permissions:
  contents: read

concurrency:
  group: v0-release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact release-prep SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind release candidate instance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p v0-release-evidence
          {
            printf 'GITHUB_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            printf 'GITHUB_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'GITHUB_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'TREE=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'ACCEPTED_V0_HEAD=%s\n' '930b8cae575edba1becc47fbebd9d944a5ebd68d'
            printf 'INTEGRATION_VALIDATED_HEAD=%s\n' '92f3243b36664265a20f6736a220b19d4e9e8843'
            printf 'UID=%s\n' "$(id -u)"
            printf 'GID=%s\n' "$(id -g)"
            printf 'UNAME=%s\n' "$(uname -a)"
            printf 'PYTHON=%s\n' "$(python --version 2>&1)"
            printf 'GIT=%s\n' "$(git --version)"
          } | tee v0-release-evidence/execution_instance.txt

      - name: Run G1-G4 release regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_g1
          python -m unittest -v tests.test_g1_f005
          python -m unittest -v tests.test_g1_f006
          python -m unittest -v tests.test_g1_f009
          python -m unittest -v tests.test_g1_f011
          python -m unittest -v tests.test_g2
          bash scripts/run_g2_topology.sh v0-release-evidence/g2-topology
          python -m unittest -v tests.test_g3
          python -m unittest -v tests.test_g4 tests.test_g4_f001_f002 tests.test_g4_f003 tests.test_g4_f005 2>&1 | tee v0-release-evidence/g4-tests.log
          bash scripts/run_g4_topology.sh v0-release-evidence/g4-topology

      - name: Capture release evidence
        shell: bash
        run: |
          set -euo pipefail
          python -I -c 'import runpy,sys; sys.path.insert(0,"."); sys.argv=["scripts/capture_g4_evidence.py","--output-dir","v0-release-evidence/g4-state"]; runpy.run_path("scripts/capture_g4_evidence.py",run_name="__main__")' 2>&1 | tee v0-release-evidence/capture-g4.log
          python -I -c 'import runpy,sys; sys.path.insert(0,"."); sys.argv=["scripts/capture_g4_f001_f002.py","--output","v0-release-evidence/g4-state/g4_f001_f002.json"]; runpy.run_path("scripts/capture_g4_f001_f002.py",run_name="__main__")' 2>&1 | tee v0-release-evidence/capture-g4-f001-f002.log

      - name: Hash release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find v0-release-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > v0-release-evidence/SHA256SUMS

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0-release-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: v0-release-evidence/
          if-no-files-found: error
          retention-days: 30
