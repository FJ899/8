name: P8 effect evidence normalization

on:
  push:
    branches:
      - p8-effect-evidence-normalization

permissions:
  contents: read

concurrency:
  group: p8-effect-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P8 candidate SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind P8 execution instance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p p8-evidence
          {
            printf 'GITHUB_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            printf 'GITHUB_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'GITHUB_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'TREE=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'P8_BASE_HEAD=%s\n' 'd37e3171e75ce8f610b64ac74b5799ad023b0289'
            printf 'P6_BASE_HEAD=%s\n' '48c1a938c75bc0beb4b82ccc9614bdfbb3933757'
            printf 'MAIN_BASE_HEAD=%s\n' '9b36a8d0f4a938442939320a46ad44ceaba39e3c'
            printf 'ACCEPTED_G4_HEAD=%s\n' '930b8cae575edba1becc47fbebd9d944a5ebd68d'
            printf 'WORKFLOW_BLOB=%s\n' "$(git rev-parse HEAD:.github/workflows/p8-effect-evidence.yml)"
            printf 'P8_EVIDENCE_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/evidence.py)"
            printf 'P8_TEST_BLOB=%s\n' "$(git rev-parse HEAD:tests/test_effect_evidence.py)"
            printf 'RUNTIME_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/runtime.py)"
            printf 'BINDINGS_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/bindings.py)"
            printf 'RECONCILIATION_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/reconciliation.py)"
            printf 'EFFECT_SEAMS_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/effect_seams.py)"
            printf 'G3_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/g3.py)"
            printf 'G4_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/g4.py)"
            printf 'HTTP_KERNEL_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/http_cas.py)"
            printf 'HTTP_TYPES_BLOB=%s\n' "$(git rev-parse HEAD:agency_kernel/http_cas_types.py)"
            printf 'P7_TOPOLOGY_BLOB=%s\n' "$(git rev-parse HEAD:scripts/run_http_cas_topology.sh)"
            printf 'UID=%s\n' "$(id -u)"
            printf 'GID=%s\n' "$(id -g)"
            printf 'UNAME=%s\n' "$(uname -a)"
            printf 'PYTHON=%s\n' "$(python --version 2>&1)"
            printf 'GIT=%s\n' "$(git --version)"
          } | tee p8-evidence/execution_instance.txt

      - name: Run locked semantic regression oracle
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m unittest -v tests.test_g1
            python -m unittest -v tests.test_g1_f005
            python -m unittest -v tests.test_g1_f006
            python -m unittest -v tests.test_g1_f009
            python -m unittest -v tests.test_g1_f011
            python -m unittest -v tests.test_g2
            python -m unittest -v tests.test_g3
            python -m unittest -v tests.test_g4 tests.test_g4_f001_f002 tests.test_g4_f003 tests.test_g4_f005
          } 2>&1 | tee p8-evidence/oracle-a.log

      - name: Run inherited P1 conformance oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_effect_domain_conformance \
            tests.test_effect_domain_conformance_envelope \
            2>&1 | tee p8-evidence/p1-conformance.log

      - name: Run inherited P2 effect seam oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_effect_seams 2>&1 | tee p8-evidence/p2-effect-seams.log

      - name: Run inherited P3 trusted runtime oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_kernel_runtime \
            tests.test_kernel_runtime_start_denial \
            2>&1 | tee p8-evidence/p3-kernel-runtime.log

      - name: Run inherited P4 trusted capability binding oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_trusted_capability_binding \
            tests.test_trusted_capability_binding_misbind \
            2>&1 | tee p8-evidence/p4-binding.log

      - name: Run inherited P5 reconciliation oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_reconciliation 2>&1 | tee p8-evidence/p5-reconciliation.log

      - name: Run inherited P6 HTTP CAS oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_http_cas 2>&1 | tee p8-evidence/p6-http-cas.log

      - name: Run P8 effect evidence oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_effect_evidence 2>&1 | tee p8-evidence/p8-effect-evidence.log

      - name: Run inherited G2 physical capability-boundary oracle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_g2_topology.sh p8-evidence/g2-topology

      - name: Run inherited G4 physical capability-boundary oracle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_g4_topology.sh p8-evidence/g4-topology

      - name: Run inherited P7 HTTP CAS physical adversarial topology
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d /tmp/agency-kernel-p8-code.XXXXXX)"
          cleanup_stage() {
            sudo rm -rf "$STAGE"
          }
          trap cleanup_stage EXIT
          sudo chmod 755 "$STAGE"
          sudo mkdir -p "$STAGE/repo"
          sudo cp -a "$GITHUB_WORKSPACE/." "$STAGE/repo/"
          sudo chown -R root:root "$STAGE/repo"
          sudo find "$STAGE/repo" -type d -exec chmod 755 {} +
          sudo find "$STAGE/repo" -type f -exec chmod 644 {} +
          test "$(sudo git -C "$STAGE/repo" rev-parse HEAD)" = "$GITHUB_SHA"
          sudo bash -c 'cd "$1" && exec bash scripts/run_http_cas_topology.sh "$2"' _ \
            "$STAGE/repo" "$GITHUB_WORKSPACE/p8-evidence/http-cas-topology"

      - name: Hash P8 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find p8-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > p8-evidence/SHA256SUMS

      - name: Upload P8 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p8-effect-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: p8-evidence/
          if-no-files-found: error
          retention-days: 14
