name: X1B-FRAME PR37 fresh final semantic-equivalence review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact frozen ScriptOps candidate
        uses: actions/checkout@v4
        with:
          repository: FJ899/scriptops
          ref: 7515cbc1f506c7c342dc55abcc97cf884daf0987
          path: target
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review-only dependencies
        run: python -m pip install pyyaml markdown-it-py

      - name: Verify exact frozen binding and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          HEAD=$(git -C target rev-parse HEAD)
          TREE=$(git -C target rev-parse 'HEAD^{tree}')
          VERIFIER=$(git -C target hash-object scripts/verify_repository.py)
          printf 'HEAD=%s\nTREE=%s\nVERIFIER=%s\n' "$HEAD" "$TREE" "$VERIFIER"
          test "$HEAD" = "7515cbc1f506c7c342dc55abcc97cf884daf0987"
          test "$TREE" = "2b9235a9701a625e96e60c254bc1386e17039dd7"
          test "$VERIFIER" = "7947c6889b80cd86ce267be792bd68e449e24235"
          test -z "$(git -C target status --porcelain=v1)"

      - name: Run fresh semantic-equivalence metamorphic review
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fresh_semantic_equivalence_review.py" <<'PY'
          from __future__ import annotations

          from html.parser import HTMLParser
          from markdown_it import MarkdownIt
          import pathlib
          import re
          import string
          import sys

          target = pathlib.Path("target").resolve()
          sys.path.insert(0, str(target / "scripts"))
          import verify_repository as current

          parser = current.core._authority_soft_wrapped_units
          claim = current.core.layer_b_self_promotion_claim
          md = MarkdownIt("commonmark")

          class VisibleText(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.parts: list[str] = []

              def handle_data(self, data: str) -> None:
                  self.parts.append(data)

          def visible_markdown(source: str) -> str:
              rendered = md.render(source)
              p = VisibleText()
              p.feed(rendered)
              p.close()
              return "".join(p.parts).strip()

          def rejected(source: str) -> tuple[bool, str]:
              try:
                  current.core.validate_layer_b_non_authority_text(
                      "acceptance/inert.md", source
                  )
              except current.core.VerificationError as exc:
                  return True, str(exc)
              return False, "ACCEPTED"

          control = "This file grants release authority.\n"
          control_visible = visible_markdown(control)
          control_units = parser(control)
          control_claim = claim(control)
          control_rejected, control_reason = rejected(control)

          print(f"CONTROL_SOURCE={control!r}")
          print(f"VISIBLE_CONTROL={control_visible!r}")
          print(f"CONTROL_UNITS={control_units!r}")
          print(f"CONTROL_CLAIM={control_claim!r}")
          print(f"CONTROL_REJECTED={control_rejected}")
          print(f"CONTROL_REASON={control_reason!r}")

          control_ok = (
              control_visible == "This file grants release authority."
              and len(control_units) == 1
              and control_claim is not None
              and control_rejected
          )
          print(f"CONTROL_STRUCTURAL_OK={control_ok}")
          if not control_ok:
              print("RESULT=CONTROL_INVALID_FINAL_REVIEW_NOT_ESTABLISHED")
              raise SystemExit(2)

          # General representation-equivalence search, not a hand-picked finding family:
          # for every alphabetic token and every internal split, insert paired ASCII
          # punctuation delimiters of width 1 or 2. CommonMark itself filters the
          # generated source forms: only candidates whose rendered visible text is
          # byte-identical to the control and that remain one authority unit are
          # eligible. The review stops at the first policy-result divergence.
          word_spans = [m.span() for m in re.finditer(r"[A-Za-z]+", control.rstrip("\n"))]
          checked_visible_equivalents = 0

          for word_index, (start, end) in enumerate(word_spans):
              for split in range(start + 1, end):
                  for punct in string.punctuation:
                      for width in (1, 2):
                          delimiter = punct * width
                          candidate = (
                              control[:split]
                              + delimiter
                              + control[split:end]
                              + delimiter
                              + control[end:]
                          )

                          candidate_visible = visible_markdown(candidate)
                          if candidate_visible != control_visible:
                              continue

                          candidate_units = parser(candidate)
                          if len(candidate_units) != 1:
                              continue

                          checked_visible_equivalents += 1
                          candidate_claim = claim(candidate)
                          candidate_rejected, candidate_reason = rejected(candidate)

                          if candidate_rejected != control_rejected:
                              print(f"GENERATOR_WORD_INDEX={word_index}")
                              print(f"GENERATOR_SPLIT_OFFSET={split - start}")
                              print(f"GENERATOR_DELIMITER={delimiter!r}")
                              print(f"VISIBLE_EQUIVALENTS_CHECKED_BEFORE_FINDING={checked_visible_equivalents}")
                              print(f"TEST_SOURCE={candidate!r}")
                              print(f"VISIBLE_TEST={candidate_visible!r}")
                              print(f"VISIBLE_EQUIVALENT={candidate_visible == control_visible}")
                              print(f"TEST_UNITS={candidate_units!r}")
                              print(f"TEST_CLAIM={candidate_claim!r}")
                              print(f"TEST_REJECTED={candidate_rejected}")
                              print(f"TEST_REASON={candidate_reason!r}")
                              print("RESULT=FAIL_REPRODUCIBLE_FRESH_FINAL_SEMANTIC_EQUIVALENCE")
                              raise SystemExit(1)

          print(f"VISIBLE_EQUIVALENTS_CHECKED={checked_visible_equivalents}")
          print("RESULT=PASS_FRESH_FINAL_SEMANTIC_EQUIVALENCE_REVIEW")
          PY
          python -B "$RUNNER_TEMP/fresh_semantic_equivalence_review.py"

      - name: Confirm frozen target remained unmodified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(git -C target status --porcelain=v1)
          printf 'TARGET_STATUS=%q\n' "$STATUS"
          test -z "$STATUS"
