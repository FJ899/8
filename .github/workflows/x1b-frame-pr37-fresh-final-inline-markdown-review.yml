name: X1B-FRAME PR37 fresh final inline-Markdown semantic review

on:
  pull_request:
    paths:
      - '.github/workflows/x1b-frame-pr37-fresh-final-inline-markdown-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact frozen ScriptOps candidate
        uses: actions/checkout@v4
        with:
          repository: FJ899/scriptops
          ref: 2fe2867eec5a5e8e0efb71d9b41f729cd1170fa8
          path: target
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact frozen binding and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          HEAD=$(git -C target rev-parse HEAD)
          TREE=$(git -C target rev-parse 'HEAD^{tree}')
          VERIFIER=$(git -C target hash-object scripts/verify_repository.py)
          printf 'HEAD=%s\nTREE=%s\nVERIFIER=%s\n' "$HEAD" "$TREE" "$VERIFIER"
          test "$HEAD" = "2fe2867eec5a5e8e0efb71d9b41f729cd1170fa8"
          test "$TREE" = "a1bdf5fe152f5a62151364a5d57d335b8b84a05c"
          test "$VERIFIER" = "60d050b76673e2aa27bd778a8765fcd65b8b9c02"
          test -z "$(git -C target status --porcelain=v1)"
      - name: Run first fresh-final inline Markdown semantic case
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/inline_markdown_semantic_probe.py" <<'PY'
          from __future__ import annotations
          import pathlib
          import sys

          target = pathlib.Path('target').resolve()
          sys.path.insert(0, str(target / 'scripts'))
          import verify_repository as current

          control = 'This file grants release authority.\n'
          test = 'Th**is** file grants release authority.\n'
          expected_rendered = 'This file grants release authority.\n'
          semantic_equivalent = (
              test.replace('**', '') == expected_rendered
              and control == expected_rendered
          )

          parser = current.core._authority_soft_wrapped_units
          claim = current.core.layer_b_self_promotion_claim

          def rejected(source: str) -> tuple[bool, str]:
              try:
                  current.core.validate_layer_b_non_authority_text(
                      'acceptance/inert.md', source
                  )
              except current.core.VerificationError as exc:
                  return True, str(exc)
              return False, 'ACCEPTED'

          control_units = parser(control)
          test_units = parser(test)
          control_claim = claim(control)
          test_claim = claim(test)
          control_rejected, control_reason = rejected(control)
          test_rejected, test_reason = rejected(test)

          print(f'CONTROL_SOURCE={control!r}')
          print(f'TEST_SOURCE={test!r}')
          print(f'RENDERED_EQUIVALENT={semantic_equivalent}')
          print(f'CONTROL_UNITS={control_units!r}')
          print(f'TEST_UNITS={test_units!r}')
          print(f'CONTROL_CLAIM={control_claim!r}')
          print(f'TEST_CLAIM={test_claim!r}')
          print(f'CONTROL_REJECTED={control_rejected}')
          print(f'CONTROL_REASON={control_reason!r}')
          print(f'TEST_REJECTED={test_rejected}')
          print(f'TEST_REASON={test_reason!r}')

          control_ok = (
              semantic_equivalent
              and len(control_units) == 1
              and control_claim is not None
              and control_rejected
          )
          print(f'CONTROL_STRUCTURAL_OK={control_ok}')
          if not control_ok:
              print('RESULT=CONTROL_INVALID_FINAL_REVIEW_NOT_ESTABLISHED')
              raise SystemExit(2)

          if test_claim is not None and test_rejected:
              print('RESULT=PASS_FRESH_FINAL_INLINE_MARKDOWN_SEMANTIC_CASE')
              raise SystemExit(0)

          print('RESULT=FAIL_REPRODUCIBLE_FRESH_FINAL_INLINE_MARKDOWN_SEMANTIC_NORMALIZATION')
          raise SystemExit(1)
          PY
          python -B "$RUNNER_TEMP/inline_markdown_semantic_probe.py"
      - name: Confirm frozen target remained unmodified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(git -C target status --porcelain=v1)
          printf 'TARGET_STATUS=%q\n' "$STATUS"
          test -z "$STATUS"
