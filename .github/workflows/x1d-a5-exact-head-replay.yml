name: X1D-A5 exact frozen-head replay

on:
  pull_request:
    paths:
      - '.github/workflows/x1d-a5-exact-head-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen ScriptOps candidate
        uses: actions/checkout@v4
        with:
          repository: FJ899/scriptops
          ref: de4c1891ae759a056c124768d41b20d85fc566e5
          path: scriptops
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact frozen identity before tests
        working-directory: scriptops
        shell: bash
        run: |
          set -euo pipefail
          expected_head='de4c1891ae759a056c124768d41b20d85fc566e5'
          expected_tree='0bcd0a8aadf58425e7953b445f0e5e3223402f71'
          expected_code_blob='c108a0ce419b14d01f7401199458af0cc400039d'
          expected_test_blob='db9a2b5f212183335526de319501f16cea83bd96'

          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          actual_code_blob="$(git hash-object phase6/x1d_a5_github_boundary.py)"
          actual_test_blob="$(git hash-object tests/test_phase6_x1d_a5_github_boundary.py)"

          printf 'REPLAY_CHECKOUT_HEAD=%s\n' "$actual_head"
          printf 'REPLAY_CHECKOUT_TREE=%s\n' "$actual_tree"
          printf 'REPLAY_CODE_BLOB=%s\n' "$actual_code_blob"
          printf 'REPLAY_TEST_BLOB=%s\n' "$actual_test_blob"
          printf 'REPLAY_SYMBOLIC_REF=%s\n' "$(git symbolic-ref -q HEAD || printf 'DETACHED')"
          printf 'REPLAY_STATUS_PORCELAIN_BEGIN\n'
          git status --porcelain
          printf 'REPLAY_STATUS_PORCELAIN_END\n'

          test "$actual_head" = "$expected_head"
          test "$actual_tree" = "$expected_tree"
          test "$actual_code_blob" = "$expected_code_blob"
          test "$actual_test_blob" = "$expected_test_blob"
          test -z "$(git status --porcelain)"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then
            echo 'REPLAY_IDENTITY_FAIL=checkout is not detached' >&2
            exit 1
          fi
          echo 'REPLAY_IDENTITY=PASS'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record runtime provenance
        working-directory: scriptops
        shell: bash
        run: |
          set -euo pipefail
          python --version
          command -v python
          uname -a
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Install authorized test dependency
        working-directory: scriptops
        run: python -m pip install pyyaml

      - name: Compile authorized paths
        working-directory: scriptops
        run: python -m compileall -q phase6 scripts/verify_repository.py tests/test_phase6_scriptops_smoke.py

      - name: Run repository verifier
        working-directory: scriptops
        run: python scripts/verify_repository.py

      - name: Run bounded X1D-A5 deterministic tests
        working-directory: scriptops
        run: python -m unittest tests.test_phase6_x1d_a5_github_boundary -v

      - name: Run full deterministic Phase 6 regression
        working-directory: scriptops
        run: python -m unittest discover -s tests -p 'test_phase6_*.py' -v
