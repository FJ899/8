name: G1 execution evidence

on:
  workflow_dispatch:
  push:
    branches:
      - g1-semantic-integrity

permissions:
  contents: read

concurrency:
  group: g1-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact run SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Run required G1 regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest -v tests.test_g1
          python -m unittest -v tests.test_g1_f005
          python -m unittest -v tests.test_g1_f006
          python -m unittest -v tests.test_g1_f009

      - name: Bind and execute G1 evidence with F010 assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/run_g1_ci_evidence.sh g1-evidence

      - name: Upload raw G1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-evidence/
          if-no-files-found: error
          retention-days: 7
